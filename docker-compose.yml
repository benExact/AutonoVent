# Local PostgreSQL only. The password below is for this development database.
# Do not reuse it anywhere else, and do not point this file at production.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autonovent
      POSTGRES_PASSWORD: autonovent_dev_only
      POSTGRES_DB: autonovent
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonovent -d autonovent"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - autonovent_pg:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  autonovent_pg:
