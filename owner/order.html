<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omniprod | Order</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../favicon.ico" sizes="16x16">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#owner-order">Skip to order</a>
    <main class="owner-portal" id="owner-order">
      <header class="owner-portal__bar">
        <a class="brand" href="../index.html" aria-label="Omniprod">
          <img class="brand-logo" src="../assets/images/omniprod-logo.png" width="899" height="132" alt="Omniprod">
        </a>
        <nav class="owner-portal__nav" aria-label="Owner">
          <a href="orders.html">Orders</a>
          <a href="products.html">Products</a>
          <a href="carousel.html">Homepage carousel</a>
          <a href="history.html">History</a>
          <button class="button button--secondary" type="button" data-auth-logout hidden>Sign out</button>
        </nav>
      </header>
      <p class="form-status" role="status" data-auth-status></p>
      <p><a href="orders.html">Back to orders</a></p>
      <p class="form-status" role="status" data-order-status>Loading order.</p>
      <div data-order-detail></div>
      <button class="button button--secondary" type="button" data-order-retry hidden>Try again</button>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/owner-portal.js"></script>
  </body>
</html>
