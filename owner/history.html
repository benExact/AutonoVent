<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omniprod | History</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../favicon.ico" sizes="16x16">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#owner-history">Skip to history</a>
    <main class="owner-portal" id="owner-history">
      <header class="owner-portal__bar">
        <a class="brand" href="../index.html" aria-label="Omniprod">
          <img class="brand-logo" src="../assets/images/omniprod-logo.png" width="899" height="132" alt="Omniprod">
        </a>
        <nav class="owner-portal__nav" aria-label="Owner">
          <a href="orders.html">Orders</a>
          <a href="products.html">Products</a>
          <a href="carousel.html">Homepage carousel</a>
          <a href="history.html" aria-current="page">History</a>
          <button class="button button--secondary" type="button" data-auth-logout hidden>Sign out</button>
        </nav>
      </header>
      <p class="form-status" role="status" data-auth-status></p>
      <form class="history-filters" data-history-form>
        <div class="field">
          <label for="history-start">Start date</label>
          <input id="history-start" name="start_date" type="date" required>
        </div>
        <div class="field">
          <label for="history-end">End date</label>
          <input id="history-end" name="end_date" type="date" required>
        </div>
        <div class="field">
          <label for="history-product">Product</label>
          <input id="history-product" name="product" type="search" maxlength="160" autocomplete="off">
        </div>
        <div class="field">
          <label for="history-actor">Changed by</label>
          <input id="history-actor" name="changed_by" type="search" maxlength="254" autocomplete="off">
        </div>
        <div class="field">
          <label for="history-field">Field changed</label>
          <select id="history-field" name="field" data-history-field>
            <option value="">All fields</option>
          </select>
        </div>
        <div class="field">
          <label for="history-limit">Records per page</label>
          <select id="history-limit" name="limit">
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="button-row">
          <button class="button button--primary" type="submit">Apply filter</button>
          <button class="button button--secondary" type="button" data-history-clear>Clear filter</button>
        </div>
      </form>
      <p class="form-status" role="status" data-history-status>Loading history.</p>
      <div data-history></div>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/product-audit.js"></script>
    <script src="../js/owner-history.js"></script>
  </body>
</html>
