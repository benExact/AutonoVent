<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autonovent | Owner sign in</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../favicon.ico" sizes="16x16">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#owner-login">Skip to sign in</a>
    <main class="owner-gate" id="owner-login">
      <section class="owner-gate__panel" aria-labelledby="owner-heading">
        <a class="brand" href="../index.html" aria-label="Autonovent">
          <img class="brand-logo" src="../assets/images/autonovent-logo.jpg" width="651" height="567" alt="Autonovent">
        </a>
        <p class="eyebrow">Leave the dust behind.</p>
        <h1 id="owner-heading">Owner sign in</h1>
        <p class="lede">This page is for the Autonovent owner. It does not show orders or customer details.</p>
        <p class="form-status" role="status" data-auth-status></p>
        <form class="enquiry-form" data-auth-form>
          <div class="field">
            <label for="owner-email">Email</label>
            <input id="owner-email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="owner-password">Password</label>
            <input id="owner-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="button button--primary" type="submit">Sign in</button>
        </form>
        <button class="button button--secondary" type="button" data-auth-logout hidden>Sign out</button>
      </section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/owner-login.js"></script>
  </body>
</html>
