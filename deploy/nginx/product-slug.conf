# Place these locations in the Omniprod site server block.
# The API location must stay a prefix match so /product/{slug} cannot catch /api/.
# After editing: sudo nginx -t && sudo systemctl reload nginx

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^/product/[a-z0-9]+(?:-[a-z0-9]+)*$ {
    root /var/www/omniprod;
    try_files /product.html =404;
}
