# Place these locations in the Omniprod site server block.
# The API location must stay a prefix match so /product/{slug} cannot catch /api/.
# After editing: sudo nginx -t && sudo systemctl reload nginx

location ^~ /api/ {
    # Nginx rejects request bodies over 1 MB by default. Specification sheets may be 25 MB.
    client_max_body_size 26m;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# The API answers 200 with X-Accel-Redirect for a published product, or 404 when the
# product does not exist, so a deleted product's page returns a real 404 status.
# If the API cannot be reached the page still loads and shows its own message.
location ~ ^/product/(?<product_slug>[a-z0-9]+(?:-[a-z0-9]+)*)$ {
    proxy_pass http://127.0.0.1:8001/api/v1/products/$product_slug/page;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 @product_missing;
    error_page 500 502 503 504 = @product_shell;
}

location = /_product_shell {
    internal;
    root /var/www/omniprod;
    try_files /product.html =404;
}

location @product_shell {
    root /var/www/omniprod;
    try_files /product.html =404;
}

location @product_missing {
    root /var/www/omniprod;
    add_header X-Robots-Tag "noindex" always;
    try_files /product.html =404;
}
